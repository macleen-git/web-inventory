name: Wake Up Render Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-up:
    name: Resume Render and verify API health
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Resume Render service and verify health
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -uo pipefail

          API_BASE="https://api.render.com/v1"
          HEALTH_URL="https://web-inventory-new.onrender.com/api/health"
          MAX_WAIT_SECONDS=300
          RETRY_INTERVAL_SECONDS=15
          RESPONSE_FILE="$(mktemp)"
          SERVICE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE" "$SERVICE_FILE"' EXIT

          if [[ -z "${RENDER_API_KEY:-}" || -z "${RENDER_SERVICE_ID:-}" ]]; then
            echo "FAILED: Add RENDER_API_KEY and RENDER_SERVICE_ID in GitHub Actions repository secrets."
            exit 1
          fi

          echo "Checking Render service configuration..."

          SERVICE_HTTP_STATUS="$(curl --silent --show-error \
            --output "$SERVICE_FILE" \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "$API_BASE/services/$RENDER_SERVICE_ID" 2>/dev/null || true)"

          if [[ "$SERVICE_HTTP_STATUS" != "200" ]]; then
            echo "FAILED: Could not retrieve the Render service. HTTP status: ${SERVICE_HTTP_STATUS:-000}"
            echo "Check the API key, service ID, and API key permissions."
            exit 1
          fi

          SERVICE_STATE="$(jq -r '.suspended // "unknown"' "$SERVICE_FILE" 2>/dev/null || echo "unknown")"
          echo "Render service suspended state: $SERVICE_STATE"

          if [[ "$SERVICE_STATE" == "suspended" ]]; then
            echo "Service is suspended. Sending official Render resume request..."

            RESUME_HTTP_STATUS="$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              --request POST \
              --header "Accept: application/json" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "$API_BASE/services/$RENDER_SERVICE_ID/resume" 2>/dev/null || true)"

            echo "Render resume API HTTP status: ${RESUME_HTTP_STATUS:-000}"

            if [[ "$RESUME_HTTP_STATUS" != "202" ]]; then
              echo "FAILED: Render did not accept the resume request."
              cat "$RESPONSE_FILE"
              exit 1
            fi

            echo "Render accepted the resume request."
          elif [[ "$SERVICE_STATE" == "not_suspended" ]]; then
            echo "Service is not suspended. Skipping resume request and checking whether it can serve traffic."
          else
            echo "FAILED: Render returned an unknown suspended state: $SERVICE_STATE"
            cat "$SERVICE_FILE"
            exit 1
          fi

          DEADLINE=$((SECONDS + MAX_WAIT_SECONDS))
          ATTEMPT=0

          echo ""
          echo "Checking API health at: $HEALTH_URL"
          echo "Maximum wait: ${MAX_WAIT_SECONDS}s; retry interval: ${RETRY_INTERVAL_SECONDS}s."

          while (( SECONDS < DEADLINE )); do
            ATTEMPT=$((ATTEMPT + 1))
            REMAINING=$((DEADLINE - SECONDS))
            REQUEST_TIMEOUT=15
            if (( REMAINING < REQUEST_TIMEOUT )); then
              REQUEST_TIMEOUT=$REMAINING
            fi

            echo ""
            echo "[Attempt $ATTEMPT] Checking API health..."

            HTTP_STATUS="$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time "$REQUEST_TIMEOUT" \
              "$HEALTH_URL" 2>/dev/null || true)"

            if [[ -z "$HTTP_STATUS" ]]; then
              HTTP_STATUS="000"
            fi
            echo "[Attempt $ATTEMPT] HTTP status: $HTTP_STATUS"

            if [[ "$HTTP_STATUS" == "200" ]]; then
              API_STATUS="$(jq -r '.status // "missing"' "$RESPONSE_FILE" 2>/dev/null || echo "invalid")"
              DATABASE_STATUS="$(jq -r '.database // "missing"' "$RESPONSE_FILE" 2>/dev/null || echo "invalid")"
              FIREBASE_STATUS="$(jq -r '.firebaseAdmin // "missing"' "$RESPONSE_FILE" 2>/dev/null || echo "invalid")"

              echo "[Attempt $ATTEMPT] API status: $API_STATUS"
              echo "[Attempt $ATTEMPT] Database: $DATABASE_STATUS"
              echo "[Attempt $ATTEMPT] Firebase Admin: $FIREBASE_STATUS"

              if [[ "$API_STATUS" == "ok" && "$DATABASE_STATUS" == "connected" && "$FIREBASE_STATUS" == "configured" ]]; then
                echo ""
                echo "SUCCESS: Render API is responding, MySQL is connected, and Firebase Admin is configured."
                exit 0
              fi

              echo "[Attempt $ATTEMPT] API responded, but one or more dependencies are not ready."
            else
              echo "[Attempt $ATTEMPT] API is not responding yet."
            fi

            REMAINING=$((DEADLINE - SECONDS))
            if (( REMAINING <= 0 )); then
              break
            fi

            SLEEP_SECONDS=$RETRY_INTERVAL_SECONDS
            if (( REMAINING < SLEEP_SECONDS )); then
              SLEEP_SECONDS=$REMAINING
            fi
            echo "Waiting ${SLEEP_SECONDS}s before retry..."
            sleep "$SLEEP_SECONDS"
          done

          echo ""
          echo "FAILED: Render did not become healthy within ${MAX_WAIT_SECONDS}s after the resume check."
          echo "Review the Render service Events and Logs for startup, crash, or availability errors."
          exit 1
